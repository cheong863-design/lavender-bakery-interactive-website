<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="assets/logo_pic.png">
  <title>Memory Match</title>

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    /* ================= GLOBAL STYLES ================= */
    * {
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #f6e6ff, #e9d7ff);
      min-height: 100vh;
      display: flex;
      flex-direction: column; /* Changed to column to help footer sit at bottom */
      padding-top: 80px; /* Space for fixed navbar */
    }

    /* ================= NAV BAR ================= */
    .navbar {
      padding: 16px 30px;
      background: rgba(255, 255, 255, 0.9); 
      backdrop-filter: blur(10px); 
      box-shadow: 0 4px 16px rgba(150, 100, 200, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }

    .navbar-brand {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      color: #5f2c97; 
    }

    .nav-link {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;  
      font-size: 1.1rem; 
      color: #5f2c97;   
      transition: 0.3s;
    }

    .nav-link:hover {
      color: #9e54e3;
      transform: translateY(-2px);
    }

    /* ================= MAIN CONTENT ================= */
    main {
      flex: 1; /* Pushes footer down */
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 20px;
    }

    /* FIX: Renamed from .container to .game-card 
       to avoid conflict with Bootstrap 
    */
    .game-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(170, 120, 200, 0.25);
      text-align: center;
      position: relative;
    }

    h1 {
      color: #7a4ca0;
      margin-bottom: 8px;
    }

    p {
      color: #6b5b7a;
      font-size: 0.95rem;
    }

    .btn-custom {
      background: #caa7e2;
      border: none;
      padding: 12px 24px;
      border-radius: 999px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 6px 14px rgba(170, 120, 200, 0.4);
      margin-top: 16px;
    }

    .btn-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(170, 120, 200, 0.45);
    }

    .hidden {
      display: none !important;
    }

    /* Question image */
    .question-image {
      width: 100%;
      height: clamp(220px, 32vw, 300px);
      background: #ffffff;
      border-radius: 16px;
      margin: 18px 0 28px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 12px 24px rgba(120, 80, 160, 0.25);
      padding-bottom: 42px; /* Space for text at bottom */
    }

    .question-image::after {
      content: "Lavender Bakery";
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #9b7bbd;
      letter-spacing: 0.05em;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .answer-btn {
      background: #f3ebff;
      border: 2px solid #e0c9ff;
      padding: 10px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      color: #6a4a8a;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .answer-btn:hover {
      background: #e9d7ff;
      transform: scale(1.02);
    }

    /* Popup */
    .popup-overlay {
      position: fixed; /* Changed to fixed to cover screen */
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .popup {
      background: #fff;
      padding: 20px;
      border-radius: 20px;
      width: 85%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .popup h2 {
      color: #7a4ca0;
      margin-bottom: 8px;
    }

    /* ================= FOOTER ================= */
    footer {
      text-align: center;
      padding: 35px 0;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border-top: 1px solid #e5caff;
      color: #5f2c97;
      width: 100%;
    }
  </style>
</head>
<body>

        <nav class="navbar navbar-expand-lg fixed-top">
            <div class="container">
                <a class="navbar-brand fw-bold" href="homepage.html">
                    <img src="assets/logo_pic.png" width="40" height="40" class="me-2 d-inline-block align-text-top" alt="">
                    Lavender Bakery
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-end" id="navMenu">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="../homepage.html#home">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="../homepage.html#character">Character</a></li>
                                                <li class="nav-item"><a class="nav-link" href="../homepage.html#minigame">Minigame</a></li>
                        <li class="nav-item"><a class="nav-link" href="../homepage.html#portfolio">Portfolio</a></li>
                        <li class="nav-item"><a class="nav-link" href="../homepage.html#about">About</a></li>
                    </ul>
                </div>
            </div>
        </nav>

  <main>
    
    <div class="game-card" id="introScreen">
      <h1>🍰 Baker's Game</h1>
      <p>Step into our lavender bakery</p>
      <p>Sweet questions await ✨</p>
      <button class="btn-custom" onclick="startGame()">Start Baking</button>
    </div>

    <div class="game-card hidden" id="gameScreen">
      <h1 id="questionTitle">Question 1</h1>
      <p id="questionText"></p>

      <div class="question-image" id="questionImage"></div>

      <div class="answers" id="answers"></div>
    </div>

    <div class="hidden" id="popupOverlay">
      <div class="popup-overlay">
        <div class="popup">
          <h2 id="popupTitle"></h2>
          <p id="popupMessage"></p>
          <button class="btn-custom" onclick="closePopup()">OK</button>
        </div>
      </div>
    </div>

  </main>

  <footer>
    <div class="container">
        <div class="mb-3 fw-bold" style="font-family: 'Fredoka', sans-serif; letter-spacing: 1px;">© 2025 Lavender Bakery. All Rights Reserved.</div>
    </div>
  </footer>

  <audio id="clickSound" src="assets/click.wav"></audio>
  <audio id="correctSound" src="assets/correct.wav"></audio>
  <audio id="wrongSound" src="assets/incorrect.wav"></audio>

  <script>
    const questions = [
      {
        text: "A cake takes 30 minutes to bake. How long for 2 cakes?",
        image: "assets/baking.png",
        answers: [
          { text: "60 minutes", correct: false },
          { text: "30 minutes", correct: true },
          { text: "90 minutes", correct: false }
        ]
      },
      {
        text: "Ice cream melts fastest in which place?",
        image: "assets/icecream.jpg",
        answers: [
          { text: "Freezer", correct: false },
          { text: "Hot sun", correct: true },
          { text: "Fridge", correct: false }
        ]
      },
      {
        text: "Which pastry needs yeast to rise?",
        image: "assets/pastries.jpg",
        answers: [
          { text: "Croissant", correct: true },
          { text: "Cookie", correct: false },
          { text: "Brownie", correct: false }
        ]
      }
    ];

    let currentQuestion = 0;
    let allowNext = false;

    function startGame() {
      // Play click sound if available
      try { document.getElementById('clickSound').play(); } catch(e){}
      
      document.getElementById('introScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      loadQuestion();
    }

    function loadQuestion() {
      allowNext = false;
      const q = questions[currentQuestion];

      document.getElementById('questionTitle').innerText = `Question ${currentQuestion + 1}`;
      document.getElementById('questionText').innerText = q.text;
      const img = document.getElementById('questionImage');
      
      // Clear previous text
      img.innerText = ""; 
      
      // Set background image
      img.style.backgroundImage = `url('${q.image}')`;
      img.style.backgroundSize = 'contain';
      img.style.backgroundColor = '#f6ecff';
      img.style.backgroundRepeat = 'no-repeat';
      img.style.backgroundPosition = 'center';

      const answersDiv = document.getElementById('answers');
      answersDiv.innerHTML = '';

      q.answers.forEach(ans => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerText = ans.text;
        btn.onclick = () => selectAnswer(ans.correct);
        answersDiv.appendChild(btn);
      });
    }

    function selectAnswer(isCorrect) {
      if (isCorrect) {
        document.getElementById('correctSound').play();
        showPopup('✨ Yay!', "Wow! That's correct 💜");
        allowNext = true;
      } else {
        document.getElementById('wrongSound').play();
        showPopup('😢 Uh-oh', "That's incorrect. Try again!");
      }
    }

    function showPopup(title, message) {
      document.getElementById('popupTitle').innerText = title;
      document.getElementById('popupMessage').innerText = message;
      document.getElementById('popupOverlay').classList.remove('hidden');
    }

    function closePopup() {
      try { document.getElementById('clickSound').play(); } catch(e){}
      document.getElementById('popupOverlay').classList.add('hidden');

      if (allowNext) {
        currentQuestion++;
        if (currentQuestion < questions.length) {
          loadQuestion();
        } else {
          endGame();
        }
      }
    }

    function endGame() {
      document.getElementById('gameScreen').innerHTML = `
        <h1>🎉 Finished!</h1>
        <p>You completed Baker's Game 💜</p>
        <button class="btn-custom" onclick="location.reload()">Back to Start</button>
      `;
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
